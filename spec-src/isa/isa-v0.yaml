# 张量指令集 ISA v0 —— 指令编码的单一真源（SPEC-230 草案）
#
# 由 tools/isagen/gen.py 生成：
#   gem5-ext/func-core/include/gw100/isa_defs.hh  gem5 侧译码用
#   tools/gw100_testkit/isa_defs.py               Python 汇编器用
# 修改本文件后重新运行生成器，不要手改生成的文件。
#
# 约定：所有多字节字段小端；指令固定 128 字节 = 32 字节头部 + 3 个 32 字节张量操作数描述符。
# 张量操作数描述符：base 地址 + 4 维 (size, stride)，d0 为最内层；stride 以字节为单位，可为 0（广播）。
#
# 地址（SPEC-110）：
#   - 落在本地窗口 [address_map.local_sram_base, + local_sram_size) 内的是 Tile 相对地址，
#     指"执行这条指令的 Tile"的 SRAM，窗口内偏移即 SRAM 内偏移。同一条指令因此可以多播给
#     多个 Tile（SPMD），各自访问自己的 SRAM。张量整体必须落在 SRAM 容量之内，否则程序非法。
#   - 其余是全局地址：DRAM、各 Tile SRAM 的全局窗口（跨 Tile 访问用）。
#   - aux_addr 同样适用这条规则。
#
# v0.2：引入 Tile 相对地址（编码不变）。

version: "0.2"
instruction_bytes: 128

dtypes:            # code: 元素位宽（bit）
  INT8:  {code: 0, bits: 8}
  UINT8: {code: 1, bits: 8}
  INT16: {code: 2, bits: 16}
  INT32: {code: 3, bits: 32}
  FP16:  {code: 4, bits: 16}
  BF16:  {code: 5, bits: 16}
  FP32:  {code: 6, bits: 32}
  INT4:  {code: 7, bits: 4}     # 两个元素打包在一个字节里，低半字节在前

header:            # 偏移以字节计
  - {name: opcode,     offset: 0,  type: u8}
  - {name: subop,      offset: 1,  type: u8}
  - {name: flags,      offset: 2,  type: u8}
  - {name: dtype_a,    offset: 3,  type: u8}   # 操作数 0 的数据类型
  - {name: dtype_b,    offset: 4,  type: u8}   # 操作数 1 的数据类型
  - {name: dtype_c,    offset: 5,  type: u8}   # 操作数 2（目的）的数据类型
  - {name: wait_en,    offset: 8,  type: u8}   # 开始前等待：counter[wait_cnt] >= wait_val
  - {name: wait_cnt,   offset: 9,  type: u8}
  - {name: wait_val,   offset: 10, type: u16}
  - {name: sig_en,     offset: 12, type: u8}   # 完成后通知：counter[sig_cnt] += 1
  - {name: sig_cnt,    offset: 13, type: u8}
  - {name: sig_tile,   offset: 14, type: u16}  # 0xFFFF 表示本 Tile；否则为目标 Tile 编号（远程通知）
  - {name: imm,        offset: 16, type: f32}  # 标量立即数
  - {name: group_size, offset: 20, type: u16}  # INT4 反量化的分组大小
  - {name: aux_addr,   offset: 24, type: u64}  # 附加地址，例如反量化 scale 表

operand:
  count: 3
  base_offset: 32
  bytes: 32
  fields:
    - {name: addr,   offset: 0,  type: u64}
    - {name: size,   offset: 8,  type: u16, count: 4}
    - {name: stride, offset: 16, type: i32, count: 4}

flags:
  ACCUMULATE: 0x01                 # 结果累加到目的张量上

local_tile: 0xFFFF

# unit：ctrl 由 Tile 控制器自己处理；dma / me / ve 分别发给 DMA、矩阵引擎、向量引擎。
# status：implemented 表示 gem5 v0 已实现；planned 表示编码已定义、模型尚未实现。
opcodes:
  - {name: NOP,        code: 0x00, unit: ctrl, status: implemented}
  - {name: END,        code: 0x01, unit: ctrl, status: implemented,
     doc: "等本 Tile 所有单元完成后，向管理 Tile 报告完成"}
  - {name: SYNC,       code: 0x02, unit: ctrl, status: implemented,
     doc: "只使用头部的等待/通知字段"}
  - {name: DMA_COPY,   code: 0x10, unit: dma,  status: implemented,
     doc: "操作数 0 -> 操作数 2，N 维搬运；dtype_a 与 dtype_c 必须相同"}
  - {name: MATMUL,     code: 0x20, unit: me,   status: planned,
     doc: "C[M,N] (+)= A[M,K] x B[K,N]；A: d0=K,d1=M；B: d0=N,d1=K；C: d0=N,d1=M；B 为 INT4 时 aux_addr 指向 FP16 scale[K/group_size, N]"}
  - {name: VEC_BINARY, code: 0x30, unit: ve,   status: implemented,
     doc: "操作数 2 = 操作数 0 (op) 操作数 1；浮点类型按 FP32 计算后就近舍入到目的类型"}
  - {name: VEC_UNARY,  code: 0x31, unit: ve,   status: planned}
  - {name: VEC_REDUCE, code: 0x32, unit: ve,   status: planned,
     doc: "沿 d0 归约，目的张量 d0 尺寸为 1"}
  - {name: VEC_SCALAR, code: 0x33, unit: ve,   status: implemented,
     doc: "操作数 2 = 操作数 0 (op) imm"}

subops:
  VEC_BINARY: {ADD: 0, SUB: 1, MUL: 2, MAX: 3, MIN: 4}
  VEC_UNARY:  {COPY: 0, NEG: 1, EXP: 2, RSQRT: 3, RECIP: 4, SILU: 5, SQUARE: 6}
  VEC_REDUCE: {SUM: 0, MAX: 1}
  VEC_SCALAR: {ADD: 0, MUL: 1, MAX: 2}

# ---------------------------------------------------------------- 程序与 Host 接口（SPEC-400 最小子集）
program:
  magic: 0x53494341               # "ACIS"
  header_bytes: 16                # magic u32, version u16, rsv u16, num_entries u32, rsv u32
  entry_bytes: 136                # tile_mask u64 + 128 字节指令；tile_mask 第 i 位对应 Compute Tile i

mgmt_regs:                        # 相对 address_map.mgmt_mmio_base
  CMD_ADDR: {offset: 0x00, bytes: 8, access: rw, doc: "命令记录的地址"}
  DOORBELL: {offset: 0x08, bytes: 4, access: w,  doc: "写任意值启动执行"}
  STATUS:   {offset: 0x0C, bytes: 4, access: r,  doc: "0 空闲，1 执行中，2 完成，3 出错"}
  VERSION:  {offset: 0x10, bytes: 4, access: r}

command_record:                   # 32 字节，放在 Host 内存
  - {name: program_addr,    offset: 0,  type: u64}
  - {name: program_bytes,   offset: 8,  type: u32}
  - {name: flags,           offset: 12, type: u32}
  - {name: completion_addr, offset: 16, type: u64}
  - {name: tag,             offset: 24, type: u64}

completion_record:                # 32 字节，由管理 Tile 写回
  - {name: status,     offset: 0,  type: u32}
  - {name: tag,        offset: 8,  type: u64}
  - {name: start_tick, offset: 16, type: u64}
  - {name: end_tick,   offset: 24, type: u64}
