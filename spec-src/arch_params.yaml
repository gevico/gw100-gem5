# 架构参数的单一真源
#
# 版本 v0.1（2026-10-18）：gem5 初版建模的起点，对应 Device 侧架构草图 v0。
# 版本 v0.2（2026-10-18）：SRAM 操作数改为 Tile 相对寻址，新增 local_sram_base / local_sram_size。
# 这些数值都还会被 gem5 设计空间探索修正；文档和代码只引用这里的参数名，不要写死数字。
# 标注 TBD 的参数尚未拍板，当前取值仅用于让模型跑起来。

version: "0.2"

clock:
  freq_ghz: 1.0

# ---------------------------------------------------------------- 芯片布局（SPEC-100）
# 每行从左到右；坐标 (x, y)，x 为列号，y 为行号。
#   M*   Memory Tile    CT  Compute Tile
#   PCIE PCIe Tile      MGMT 管理 Tile     RSVD 预留（只有路由器）
mesh:
  cols: 6
  rows: 4
  layout:
    - [M0, CT, CT, CT, CT, PCIE]
    - [M1, CT, CT, CT, CT, MGMT]
    - [M2, CT, CT, CT, CT, RSVD]
    - [M3, CT, CT, CT, CT, RSVD]

# ---------------------------------------------------------------- 片上网络（SPEC-120）
noc:
  model: lightweight             # v0 用自研轻量模型；Garnet 只做交叉验证
  routing: xy
  link_bytes_per_cycle: 64       # TBD：Memory Tile 出口一跳要承载整行约 34 GB/s
  router_latency_cycles: 2
  link_latency_cycles: 1
  message_classes: [unicast_req, multicast_req, response]

# ---------------------------------------------------------------- 地址空间（SPEC-110，草案）
# 全局平坦地址空间，48 位。
# 张量指令里的 SRAM 操作数用 Tile 相对地址（本地窗口），同一条指令可以多播给多个 Tile；
# 本地窗口只在 Tile 内部译码，NoC 上不可见。访问其他 Tile 的 SRAM 用各自的全局窗口。
address_map:
  dram_base: 0x0000_0000_0000
  dram_size: 0x0004_0000_0000            # 16 GiB
  dram_interleave_bytes: 256             # 在 8 条通道之间交织
  local_sram_base: 0x000F_0000_0000      # 本地窗口：偏移 x 指"执行这条指令的 Tile"的 SRAM 偏移 x
  local_sram_size: 0x0000_0100_0000      # 与 tile_sram_stride 相同；超出 SRAM 容量的部分非法
  tile_sram_base: 0x0010_0000_0000
  tile_sram_stride: 0x0000_0100_0000     # 每个 Tile 一个 16 MiB 窗口，实际只用 SRAM 大小
  mgmt_mmio_base: 0x0020_0000_0000
  mgmt_mmio_size: 0x0000_0000_1000
  host_mem_base: 0x0030_0000_0000        # Host 内存窗口（v0 由 TestHost 使用，不建 PCIe 时序）
  host_mem_size: 0x0000_1000_0000        # 256 MiB

# ---------------------------------------------------------------- Compute Tile（SPEC-200 ~ 250）
compute_tile:
  sram:
    size_kib: 2048
    banks: 32
    bank_bytes: 32                # 每个 bank 每周期 32 B，按 32 B 交织
    ports: 8
    latency_cycles: 4             # TBD
  inst_queue:
    depth_per_unit: 16
  matrix_engine:
    rows: 8
    cols: 64
    dot_width: 4                  # 每个乘加单元每周期做 4 元素点积 -> 2048 乘加/周期
    act_bytes_per_cycle: 32
    weight_bytes_per_cycle: 64
    pipeline_latency_cycles: 16   # TBD
  vector_engine:
    lanes: 32                     # FP32 lane 数
    pipeline_latency_cycles: 8    # TBD
  dma:
    max_dims: 4
    request_bytes: 64
    max_outstanding: 32
  sync:
    counters: 32

# ---------------------------------------------------------------- Memory Tile（SPEC-300）
memory_tile:
  dram_type: LPDDR5X-8533
  channels_per_tile: 2
  channel_width_bits: 16
  # 8 条 x16 通道 × 8533 MT/s × 2 B ≈ 136.5 GB/s

# ---------------------------------------------------------------- 管理 Tile（SPEC-330 / 400）
mgmt_tile:
  dispatch: centralized           # 已确认：集中派发张量级指令
  inst_channel:                   # TBD：专用指令通道还是复用 NoC
    latency_cycles: 10
    bytes_per_cycle: 16
  max_tiles: 64

# ---------------------------------------------------------------- Host 接口（SPEC-310，v0 不建时序）
pcie:
  gen: 4
  lanes: 4

# ---------------------------------------------------------------- 基准模型
workloads:
  primary: LLaMA2-7B
  secondary: Llama-3.2-1B
